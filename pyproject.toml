[project]
name = "anomaly-detection"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "captum>=0.9.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
